<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Game - Play</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900&family=Outfit:wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'var(--background)', foreground: 'var(--foreground)',
            card: { DEFAULT: 'var(--card)', foreground: 'var(--card-foreground)' },
            primary: { DEFAULT: 'var(--primary)', foreground: 'var(--primary-foreground)' },
            secondary: { DEFAULT: 'var(--secondary)', foreground: 'var(--secondary-foreground)' },
            muted: { DEFAULT: 'var(--muted)', foreground: 'var(--muted-foreground)' },
            accent: { DEFAULT: 'var(--accent)', foreground: 'var(--accent-foreground)' },
            destructive: { DEFAULT: 'var(--destructive)', foreground: '#ffffff' },
            border: 'var(--border)',
          },
          fontFamily: {
            sans: ['var(--font-sans)', 'system-ui', 'sans-serif'],
            heading: ['var(--font-heading)', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    :root {
      --background: #0a0f1e;
      --foreground: #f8fafc;
      --card: #1a1f35;
      --card-foreground: #ffffff;
      --primary: #8b5cf6;
      --primary-foreground: #ffffff;
      --secondary: #ec4899;
      --secondary-foreground: #ffffff;
      --muted: #2d3548;
      --muted-foreground: #94a3b8;
      --accent: #06b6d4;
      --accent-foreground: #ffffff;
      --destructive: #ef4444;
      --border: #2d3548;
      --glow-primary: rgba(139, 92, 246, 0.15);
      --glow-secondary: rgba(236, 72, 153, 0.1);
      --radius: 24px;
      --font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
      --font-heading: "Outfit", system-ui, sans-serif;
    }

    .light-mode {
      --background: #ffffff;
      --foreground: #1e293b;
      --card: #f1f5f9;
      --card-foreground: #1e293b;
      --primary: #7c3aed;
      --primary-foreground: #ffffff;
      --secondary: #db2777;
      --secondary-foreground: #ffffff;
      --muted: #e2e8f0;
      --muted-foreground: #64748b;
      --accent: #0891b2;
      --accent-foreground: #ffffff;
      --destructive: #dc2626;
      --border: #e2e8f0;
      --glow-primary: rgba(124, 58, 237, 0.08);
      --glow-secondary: rgba(219, 39, 119, 0.06);
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--background);
      color: var(--foreground);
      transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                  color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .light-mode .bg-card\/40 {
      background-color: rgba(241, 245, 249, 0.7) !important;
    }

    .light-mode .bg-card\/50 {
      background-color: rgba(241, 245, 249, 0.8) !important;
    }

    .light-mode .bg-card\/60 {
      background-color: rgba(241, 245, 249, 0.85) !important;
    }

    .light-mode .bg-card\/80 {
      background-color: rgba(241, 245, 249, 0.9) !important;
    }

    .light-mode .bg-card\/90 {
      background-color: rgba(241, 245, 249, 0.95) !important;
    }

    .light-mode .border-white\/5,
    .light-mode .border-white\/10 {
      border-color: rgba(226, 232, 240, 0.6) !important;
    }

    .light-mode .shadow-primary\/5,
    .light-mode .shadow-primary\/20 {
      box-shadow: 0 4px 12px var(--glow-primary) !important;
    }

    .light-mode .bg-primary\/20 {
      background-color: rgba(124, 58, 237, 0.12) !important;
    }

    .light-mode .bg-primary\/10 {
      background-color: rgba(124, 58, 237, 0.08) !important;
    }

    .light-mode .bg-destructive\/10 {
      background-color: rgba(220, 38, 38, 0.08) !important;
    }

    .light-mode .bg-destructive\/20 {
      background-color: rgba(220, 38, 38, 0.12) !important;
    }

    .light-mode .border-destructive\/20,
    .light-mode .border-destructive\/30 {
      border-color: rgba(220, 38, 38, 0.25) !important;
    }

    .light-mode .bg-accent\/10 {
      background-color: rgba(8, 145, 178, 0.08) !important;
    }

    .light-mode .bg-accent\/20 {
      background-color: rgba(8, 145, 178, 0.12) !important;
    }

    .light-mode .border-accent\/20,
    .light-mode .border-accent\/30 {
      border-color: rgba(8, 145, 178, 0.25) !important;
    }

    .light-mode .bg-secondary\/10 {
      background-color: rgba(219, 39, 119, 0.08) !important;
    }

    .light-mode .bg-secondary\/20 {
      background-color: rgba(219, 39, 119, 0.12) !important;
    }

    .light-mode .border-secondary\/20,
    .light-mode .border-secondary\/30 {
      border-color: rgba(219, 39, 119, 0.25) !important;
    }

    .light-mode .border-primary\/20,
    .light-mode .border-primary\/30,
    .light-mode .border-primary\/50 {
      border-color: rgba(124, 58, 237, 0.25) !important;
    }

    .light-mode .text-foreground {
      color: var(--foreground) !important;
    }

    .light-mode .bg-background\/50 {
      background-color: rgba(255, 255, 255, 0.6) !important;
    }

    .light-mode .bg-white\/5 {
      background-color: rgba(226, 232, 240, 0.5) !important;
    }

    /* Smooth transitions for theme changes */
    * {
      transition-property: background-color, border-color, color, fill, stroke, box-shadow;
      transition-duration: 0.3s;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }

    button, a, [role="button"] { 
      transition: all 0.15s ease !important; 
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Light mode glow effects */
    .light-mode .blur-\[100px\],
    .light-mode .blur-\[80px\] {
      opacity: 0.4;
    }

    /* Icon transition */
    iconify-icon {
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
  </style>
  <script src="i18n.js"></script>
</head>
<body>
  <div class="relative min-h-screen bg-background text-foreground font-sans flex flex-col overflow-hidden">
  
  <div class="absolute top-[-10%] right-[-20%] w-[350px] h-[350px] bg-primary/20 rounded-full blur-[100px] pointer-events-none animate-pulse"></div>
  <div class="absolute bottom-[20%] left-[-10%] w-[300px] h-[300px] bg-secondary/10 rounded-full blur-[80px] pointer-events-none"></div>

  <div class="flex-1 overflow-y-auto pb-32 no-scrollbar">
    
    <!-- Game Header -->
    <header class="px-4 pt-4 pb-2">
      <div class="flex justify-between items-center gap-3">
        <!-- Left: Score -->
        <div class="flex items-center gap-2">
          <button id="settingsToggleBtn" class="w-9 h-9 rounded-full bg-card/50 border border-white/10 flex items-center justify-center hover:bg-card transition-colors">
            <iconify-icon icon="lucide:settings" class="text-muted-foreground text-lg"></iconify-icon>
          </button>
          <div class="flex flex-col">
            <span class="text-[10px] font-medium text-muted-foreground uppercase" data-i18n="score">Score</span>
            <span class="text-lg font-black text-primary"><span id="scoreDisplay">0.0</span></span>
          </div>
        </div>
        
        <!-- Center: Timer -->
        <div id="timerDisplay" class="relative">
          <div class="w-16 h-16 rounded-full bg-card/60 backdrop-blur border-2 border-primary/50 flex items-center justify-center shadow-md">
            <div class="text-center">
              <span id="timerNumber" class="text-3xl font-black text-foreground block leading-none">10</span>
            </div>
          </div>
          <svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none">
            <circle cx="50%" cy="50%" r="42%" fill="none" stroke="currentColor" stroke-width="2" class="text-primary/20"></circle>
            <circle id="timerRing" cx="50%" cy="50%" r="42%" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="165" stroke-dashoffset="0" stroke-linecap="round" class="text-primary transition-all duration-500"></circle>
          </svg>
        </div>

        <!-- Right: Controls -->
        <div class="flex items-center gap-2">
          <button id="themeToggleBtn" class="w-9 h-9 rounded-full bg-card/50 border border-white/10 flex items-center justify-center hover:bg-card transition-all hover:scale-110 active:scale-95">
            <iconify-icon id="themeIcon" icon="lucide:moon" class="text-muted-foreground text-lg transition-all"></iconify-icon>
          </button>
          <button id="top3ToggleBtn" class="h-9 px-3 rounded-full bg-card/50 border border-white/10 flex items-center gap-1.5 hover:bg-card/70 transition-all hover:scale-105 active:scale-95">
            <iconify-icon icon="lucide:trophy" class="text-accent text-sm"></iconify-icon>
            <span class="font-bold text-foreground text-xs">Top 3</span>
          </button>
        </div>
      </div>

      <!-- Progress Bar -->
      <div id="progressBars" class="w-full flex gap-1 mt-3 h-1"></div>
    </header>

    <!-- Question Section -->
    <div class="px-4 mt-4">
      
      <!-- Question Card -->
      <div class="bg-card/40 backdrop-blur-xl border border-white/5 rounded-3xl p-6 shadow-xl ring-1 ring-white/5 min-h-[140px] flex flex-col items-center justify-center text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/50 to-transparent"></div>
        
        <h2 id="questionText" class="text-lg font-bold leading-tight text-foreground relative z-10 mb-3">
          <span data-i18n="loading_questions">Loading questions...</span>
        </h2>
        
        <div class="flex gap-2">
           <span class="px-2 py-0.5 rounded-lg bg-background/50 border border-white/5 text-[9px] font-bold text-muted-foreground uppercase">Category</span>
           <span class="px-2 py-0.5 rounded-lg bg-background/50 border border-white/5 text-[9px] font-bold text-accent uppercase">Difficulty</span>
        </div>
      </div>
    </div>

    <!-- Answer Grid -->
    <div class="px-4 mt-4 grid grid-cols-2 gap-3">
      
      <button data-index="0" class="answer-btn relative group h-28 rounded-2xl overflow-hidden shadow-md active:scale-95 transition-all">
        <div class="absolute inset-0 bg-destructive/10 border-2 border-destructive/20 rounded-2xl group-hover:bg-destructive/20 transition-colors"></div>
        <div class="absolute top-3 left-3 w-7 h-7 rounded-full bg-destructive/20 flex items-center justify-center border border-destructive/30">
          <span class="text-destructive font-black text-xs">A</span>
        </div>
        <div class="absolute inset-0 flex items-center justify-center p-3">
          <span class="text-base font-bold text-foreground text-center">Answer A</span>
        </div>
      </button>

      <button data-index="1" class="answer-btn relative group h-28 rounded-2xl overflow-hidden shadow-md active:scale-95 transition-all">
        <div class="absolute inset-0 bg-accent/10 border-2 border-accent/20 rounded-2xl group-hover:bg-accent/20 transition-colors"></div>
        <div class="absolute top-3 left-3 w-7 h-7 rounded-full bg-accent/20 flex items-center justify-center border border-accent/30">
          <span class="text-accent font-black text-xs">B</span>
        </div>
        <div class="absolute inset-0 flex items-center justify-center p-3">
          <span class="text-base font-bold text-foreground text-center">Answer B</span>
        </div>
      </button>

      <button data-index="2" class="answer-btn relative group h-28 rounded-2xl overflow-hidden shadow-md active:scale-95 transition-all">
        <div class="absolute inset-0 bg-primary/10 border-2 border-primary/20 rounded-2xl group-hover:bg-primary/20 transition-colors"></div>
        <div class="absolute top-3 left-3 w-7 h-7 rounded-full bg-primary/20 flex items-center justify-center border border-primary/30">
          <span class="text-primary font-black text-xs">C</span>
        </div>
        <div class="absolute inset-0 flex items-center justify-center p-3">
          <span class="text-base font-bold text-foreground text-center">Answer C</span>
        </div>
      </button>

      <button data-index="3" class="answer-btn relative group h-28 rounded-2xl overflow-hidden shadow-md active:scale-95 transition-all">
        <div class="absolute inset-0 bg-secondary/10 border-2 border-secondary/20 rounded-2xl group-hover:bg-secondary/20 transition-colors"></div>
        <div class="absolute top-3 left-3 w-7 h-7 rounded-full bg-secondary/20 flex items-center justify-center border border-secondary/30">
          <span class="text-secondary font-black text-xs">D</span>
        </div>
        <div class="absolute inset-0 flex items-center justify-center p-3">
          <span class="text-base font-bold text-foreground text-center">Answer D</span>
        </div>
      </button>

    </div>

    <!-- Controls -->
    <div class="px-4 mt-4 flex items-center justify-between gap-4">
      <span id="progressText" class="text-sm text-muted-foreground font-bold">
        <span data-i18n="question">Question</span> 0 / 0
      </span>
      <button id="nextBtn" class="px-5 py-2.5 bg-primary text-white rounded-xl font-bold shadow-lg hover:bg-primary/90 transition" data-i18n="next">Next</button>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center">
      <div class="bg-card border border-white/10 rounded-2xl p-6 w-80 max-h-[80vh] overflow-y-auto shadow-2xl">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-black text-primary" data-i18n="game_settings">Game Settings</h3>
          <button id="closeSettingsBtn" class="text-muted-foreground hover:text-foreground transition">
            <iconify-icon icon="lucide:x" class="text-2xl"></iconify-icon>
          </button>
        </div>
        <div class="flex flex-col gap-3">
          <div>
            <label class="text-xs text-muted-foreground block mb-1" data-i18n="language">Language</label>
            <select id="settingLanguage" class="w-full p-2 rounded-lg bg-card border border-border/50 text-foreground focus:border-primary outline-none transition">
              <option value="uzb">O'zbek</option>
              <option value="eng">English</option>
              <option value="rus">Русский</option>
            </select>
          </div>

          <div>
            <label class="text-xs text-muted-foreground block mb-1" data-i18n="questions">Questions</label>
            <select id="settingAmount" class="w-full p-2 rounded-lg bg-card border border-border/50 text-foreground focus:border-primary outline-none transition">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="15">15</option>
            </select>
          </div>

          <div>
            <label class="text-xs text-muted-foreground block mb-1" data-i18n="difficulty">Difficulty</label>
            <select id="settingDifficulty" class="w-full p-2 rounded-lg bg-card border border-border/50 text-foreground focus:border-primary outline-none transition">
              <option value="easy" data-i18n="easy">Easy</option>
              <option value="medium" selected data-i18n="medium">Medium</option>
              <option value="hard" data-i18n="hard">Hard</option>
            </select>
          </div>

          <div>
            <label class="text-xs text-muted-foreground block mb-1" data-i18n="category">Category</label>
            <select id="settingCategory" class="w-full p-2 rounded-lg bg-card border border-border/50 text-foreground focus:border-primary outline-none transition">
              <option value="any" data-i18n="any_category">Any Category</option>
            </select>
          </div>

          <div>
            <label class="text-xs text-muted-foreground block mb-1" data-i18n="time_question">Time/Question</label>
            <select id="settingTime" class="w-full p-2 rounded-lg bg-card border border-border/50 text-foreground focus:border-primary outline-none transition">
              <option value="5">5s</option>
              <option value="10" selected>10s</option>
              <option value="20">20s</option>
            </select>
          </div>

          <button id="applySettingsBtn" class="mt-2 px-4 py-2 w-full bg-accent text-white rounded-lg font-bold hover:bg-accent/90 transition" data-i18n="apply_settings">Apply Settings</button>
        </div>
      </div>
    </div>

    <!-- Top 3 Modal -->
    <div id="top3Modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center">
      <div class="bg-card border border-white/10 rounded-2xl p-6 w-80 shadow-2xl">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-black text-primary" data-i18n="top_3_scores">Top 3 Scores</h3>
          <button id="closeTop3Btn" class="text-muted-foreground hover:text-foreground transition">
            <iconify-icon icon="lucide:x" class="text-2xl"></iconify-icon>
          </button>
        </div>
        <div id="topScoresList" class="flex flex-col gap-2"></div>
      </div>
    </div>

  </div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 w-full bg-background/80 backdrop-blur-xl border-t border-white/5 pb-safe pt-2 z-50">
    <div class="flex justify-around items-center h-[70px]">
      
      <button class="flex flex-col items-center justify-center w-16 gap-1 group">
        <div class="relative p-1.5 rounded-xl bg-primary/10 text-primary transition-all">
          <iconify-icon icon="lucide:gamepad-2" width="24" height="24"></iconify-icon>
          <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-primary"></div>
        </div>
        <span class="text-[10px] font-bold text-primary" data-i18n="play">Play</span>
      </button>

      <button class="flex flex-col items-center justify-center w-16 gap-1 group">
        <div class="p-1.5 text-muted-foreground group-hover:text-foreground transition-colors">
          <iconify-icon icon="lucide:trophy" width="24" height="24"></iconify-icon>
        </div>
        <span class="text-[10px] font-medium text-muted-foreground group-hover:text-foreground" data-i18n="rank">Rank</span>
      </button>

      <button class="flex flex-col items-center justify-center w-16 gap-1 group">
        <div class="p-1.5 text-muted-foreground group-hover:text-foreground transition-colors">
          <iconify-icon icon="lucide:user" width="24" height="24"></iconify-icon>
        </div>
        <span class="text-[10px] font-medium text-muted-foreground group-hover:text-foreground" data-i18n="profile">Profile</span>
      </button>

      <button id="settingsToggleBtn" class="flex flex-col items-center justify-center w-16 gap-1 group">
        <div class="p-1.5 text-muted-foreground group-hover:text-foreground transition-colors">
          <iconify-icon icon="lucide:settings" width="24" height="24"></iconify-icon>
        </div>
        <span class="text-[10px] font-medium text-muted-foreground group-hover:text-foreground" data-i18n="settings">Settings</span>
      </button>

    </div>
  </nav>

</div>
  <script src="./quiz.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Set language from storage
      const savedLang = localStorage.getItem('quiz_language') || 'uzb';
      if (window.i18n) window.i18n.setLang(savedLang);
      
      // Theme toggle with smooth animation
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      const themeIcon = document.getElementById('themeIcon');
      const savedTheme = localStorage.getItem('quiz_theme') || 'dark';
      
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        themeIcon.setAttribute('icon', 'lucide:sun');
      }

      themeToggleBtn.addEventListener('click', () => {
        // Rotate animation
        themeIcon.style.transform = 'rotate(360deg)';
        setTimeout(() => {
          themeIcon.style.transform = 'rotate(0deg)';
        }, 400);
        
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        localStorage.setItem('quiz_theme', isLight ? 'light' : 'dark');
        
        // Change icon after half rotation
        setTimeout(() => {
          themeIcon.setAttribute('icon', isLight ? 'lucide:sun' : 'lucide:moon');
        }, 200);
      });

      // Navigation
      document.querySelectorAll('nav button').forEach((b) => {
        const key = b.querySelector('[data-i18n]')?.getAttribute('data-i18n');

       if (key === 'play')
         b.addEventListener('click', () => window.location.href = 'play---quiz.html');

       if (key === 'rank')
          b.addEventListener('click', () => window.location.href = 'leaderboard.html');

      if (key === 'profile')
         b.addEventListener('click', () => window.location.href = 'profile.html');
      });


      const settingsModal = document.getElementById('settingsModal');
      const closeSettingsBtn = document.getElementById('closeSettingsBtn');

      function openSettings() {
        settingsModal.classList.remove('hidden');
      }

      function closeSettings() {
         settingsModal.classList.add('hidden');
      }

      // Yopish
      closeSettingsBtn.addEventListener('click', closeSettings);
      settingsModal.addEventListener('click', (e) => {
        if (e.target === settingsModal) closeSettings();
      });
      
      document.addEventListener('click', (e) => {
        const settingsIcon = e.target.closest('iconify-icon[icon="lucide:settings"]');
        const settingsText = e.target.closest('[data-i18n="settings"]');

         if (settingsIcon || settingsText) {
          e.preventDefault();
          settingsModal.classList.remove('hidden');
        }
      });
    });
  </script>
</body>
</html>
